<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Click and Drag</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="items">
    <div class="item item1">01</div>
    <div class="item item2">02</div>
    <div class="item item3">03</div>
    <div class="item item4">04</div>
    <div class="item item5">05</div>
    <div class="item item6">06</div>
    <div class="item item7">07</div>
    <div class="item item8">08</div>
    <div class="item item9">09</div>
    <div class="item item10">10</div>
    <div class="item item11">11</div>
    <div class="item item12">12</div>
    <div class="item item13">13</div>
    <div class="item item14">14</div>
    <div class="item item15">15</div>
    <div class="item item16">16</div>
    <div class="item item17">17</div>
    <div class="item item18">18</div>
    <div class="item item19">19</div>
    <div class="item item20">20</div>
    <div class="item item21">21</div>
    <div class="item item22">22</div>
    <div class="item item23">23</div>
    <div class="item item24">24</div>
    <div class="item item25">25</div>
  </div>

<script>
//Your code goes here 
const container = document.querySelector(".items");

let selectedItem = null;
let placeholder = null;
let offsetX = 0;
let offsetY = 0;

container.addEventListener("mousedown", (e) => {
  const item = e.target.closest(".item");

  if (!item || !container.contains(item)) return;

  selectedItem = item;

  const itemRect = selectedItem.getBoundingClientRect();
  const containerRect = container.getBoundingClientRect();

  // Remember where inside the cube the mouse was clicked.
  offsetX = e.clientX - itemRect.left;
  offsetY = e.clientY - itemRect.top;

  // Preserve the original grid cell.
  placeholder = document.createElement("div");
  placeholder.style.width = `${itemRect.width}px`;
  placeholder.style.height = `${itemRect.height}px`;
  placeholder.style.visibility = "hidden";

  selectedItem.parentNode.insertBefore(placeholder, selectedItem);

  // Calculate the cube's position relative to the container.
  const x =
    itemRect.left -
    containerRect.left -
    container.clientLeft;

  const y =
    itemRect.top -
    containerRect.top -
    container.clientTop;

  // Allow the selected cube to move independently.
  selectedItem.style.position = "absolute";
  selectedItem.style.boxSizing = "border-box";
  selectedItem.style.width = `${itemRect.width}px`;
  selectedItem.style.height = `${itemRect.height}px`;
  selectedItem.style.margin = "0";
  selectedItem.style.left = `${x}px`;
  selectedItem.style.top = `${y}px`;
  selectedItem.style.zIndex = "1000";
  selectedItem.style.cursor = "grabbing";
});

document.addEventListener("mousemove", (e) => {
  if (!selectedItem) return;

  const styles = getComputedStyle(container);

  const paddingLeft = parseFloat(styles.paddingLeft);
  const paddingRight = parseFloat(styles.paddingRight);
  const paddingTop = parseFloat(styles.paddingTop);
  const paddingBottom = parseFloat(styles.paddingBottom);

  // Calculate the usable content area.
  const minX = paddingLeft;
  const minY = paddingTop;

  const maxX = Math.max(
    minX,
    container.clientWidth -
      paddingRight -
      selectedItem.offsetWidth
  );

  const maxY = Math.max(
    minY,
    container.clientHeight -
      paddingBottom -
      selectedItem.offsetHeight
  );

  const containerRect = container.getBoundingClientRect();

  // Calculate the desired position relative to the container.
  let x =
    e.clientX -
    containerRect.left -
    container.clientLeft -
    offsetX;

  let y =
    e.clientY -
    containerRect.top -
    container.clientTop -
    offsetY;

  // Keep the entire cube inside the content area.
  x = Math.max(minX, Math.min(x, maxX));
  y = Math.max(minY, Math.min(y, maxY));

  selectedItem.style.left = `${x}px`;
  selectedItem.style.top = `${y}px`;
});

document.addEventListener("mouseup", () => {
  if (!selectedItem) return;

  selectedItem.style.cursor = "grab";
  selectedItem.style.zIndex = "";

  // Allow another cube to be selected.
  selectedItem = null;
  placeholder = null;
});

</script>

  </body>
</html>
