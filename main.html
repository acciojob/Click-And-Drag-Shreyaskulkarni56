<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Click and Drag</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="items">
    <div class="item item1">01</div>
    <div class="item item2">02</div>
    <div class="item item3">03</div>
    <div class="item item4">04</div>
    <div class="item item5">05</div>
    <div class="item item6">06</div>
    <div class="item item7">07</div>
    <div class="item item8">08</div>
    <div class="item item9">09</div>
    <div class="item item10">10</div>
    <div class="item item11">11</div>
    <div class="item item12">12</div>
    <div class="item item13">13</div>
    <div class="item item14">14</div>
    <div class="item item15">15</div>
    <div class="item item16">16</div>
    <div class="item item17">17</div>
    <div class="item item18">18</div>
    <div class="item item19">19</div>
    <div class="item item20">20</div>
    <div class="item item21">21</div>
    <div class="item item22">22</div>
    <div class="item item23">23</div>
    <div class="item item24">24</div>
    <div class="item item25">25</div>
  </div>

<script>
//Your code goes here 


const container = document.querySelector(".items");

let selectedItem = null;
let placeholder = null;
let offsetX = 0;
let offsetY = 0;

container.addEventListener("mousedown", (e) => {
  const item = e.target.closest(".item");

  if (!item || !container.contains(item)) return;

  selectedItem = item;

  const rect = selectedItem.getBoundingClientRect();
  const containerRect = container.getBoundingClientRect();

  offsetX = e.clientX - rect.left;
  offsetY = e.clientY - rect.top;

  // Preserve the grid cell.
  placeholder = document.createElement("div");
  placeholder.style.width = `${rect.width}px`;
  placeholder.style.height = `${rect.height}px`;
  placeholder.style.visibility = "hidden";

  selectedItem.parentNode.insertBefore(placeholder, selectedItem);

  // Calculate coordinates relative to the container's inner border.
  const x = rect.left - containerRect.left - container.clientLeft;
  const y = rect.top - containerRect.top - container.clientTop;

  selectedItem.style.position = "absolute";
  selectedItem.style.boxSizing = "border-box";
  selectedItem.style.width = `${rect.width}px`;
  selectedItem.style.height = `${rect.height}px`;
  selectedItem.style.left = `${x}px`;
  selectedItem.style.top = `${y}px`;
  selectedItem.style.margin = "0";
  selectedItem.style.zIndex = "1000";
});

document.addEventListener("mousemove", (e) => {
  if (!selectedItem) return;

  const containerRect = container.getBoundingClientRect();

  // The container's inner content area is the movement boundary.
  const maxX = container.clientWidth - selectedItem.offsetWidth;
  const maxY = container.clientHeight - selectedItem.offsetHeight;

  let x =
    e.clientX - containerRect.left - container.clientLeft - offsetX;

  let y =
    e.clientY - containerRect.top - container.clientTop - offsetY;

  // Clamp the cube's entire bounding box inside the container.
  x = Math.max(0, Math.min(x, Math.max(0, maxX)));
  y = Math.max(0, Math.min(y, Math.max(0, maxY)));

  selectedItem.style.left = `${x}px`;
  selectedItem.style.top = `${y}px`;
});

document.addEventListener("mouseup", () => {
  if (!selectedItem) return;

  selectedItem.style.zIndex = "";
  selectedItem.style.cursor = "grab";

  // Keep the placeholder so the grid retains its original structure.
  selectedItem = null;
  placeholder = null;
});

</script>

  </body>
</html>
